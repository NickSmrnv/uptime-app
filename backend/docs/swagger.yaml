basePath: /
definitions:
  handler.AuthResponse:
    properties:
      accessToken:
        type: string
      user:
        $ref: '#/definitions/handler.UserResponse'
    type: object
  handler.CreateMonitorRequest:
    properties:
      intervalSeconds:
        example: 300
        type: integer
      url:
        example: https://example.com/health
        type: string
    type: object
  handler.CredentialsRequest:
    properties:
      email:
        example: alex@example.com
        type: string
      name:
        example: Alex
        type: string
      password:
        example: correct-horse-battery-staple
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: invalid input
        type: string
    type: object
  handler.MonitorResponse:
    properties:
      configVersion:
        type: integer
      createdAt:
        type: string
      historyVersion:
        type: integer
      id:
        type: string
      intervalSeconds:
        type: integer
      lastCheckedAt:
        type: string
      lastDurationMs:
        type: integer
      lastError:
        type: string
      lastStatusCode:
        type: integer
      nextCheckAt:
        type: string
      status:
        enum:
        - pending
        - up
        - down
        - stale
        type: string
      url:
        type: string
    type: object
  handler.UpdateMonitorRequest:
    properties:
      intervalSeconds:
        example: 300
        type: integer
      url:
        example: https://example.com/health
        type: string
    type: object
  handler.UpdateProfileRequest:
    properties:
      name:
        example: Alexandra
        type: string
    type: object
  handler.UserResponse:
    properties:
      avatarUrl:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  model.MonitorBucket:
    properties:
      failurePercent:
        type: number
      failures:
        type: integer
      start:
        type: string
      successPercent:
        type: number
      successes:
        type: integer
    type: object
  model.MonitorStats:
    properties:
      bucketSeconds:
        type: integer
      buckets:
        items:
          $ref: '#/definitions/model.MonitorBucket'
        type: array
      failurePercent:
        type: number
      failures:
        type: integer
      from:
        type: string
      historyVersion:
        type: integer
      period:
        type: string
      successPercent:
        type: number
      successes:
        type: integer
      to:
        type: string
    type: object
  service.UploadedFile:
    properties:
      filename:
        type: string
      key:
        type: string
      size:
        type: integer
      url:
        type: string
    type: object
info:
  contact: {}
  description: HTTP API for Uptime authentication, profile management, and file uploads.
  title: Uptime API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CredentialsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Log in
      tags:
      - authentication
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - RefreshCookie: []
      summary: Log out
      tags:
      - authentication
  /auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - RefreshCookie: []
      summary: Refresh an access token
      tags:
      - authentication
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CredentialsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a user
      tags:
      - authentication
  /monitors:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.MonitorResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List monitors
      tags:
      - monitors
    post:
      consumes:
      - application/json
      parameters:
      - description: Monitor configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateMonitorRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.MonitorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a monitor
      tags:
      - monitors
  /monitors/{id}:
    delete:
      parameters:
      - description: Monitor ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a monitor
      tags:
      - monitors
    patch:
      consumes:
      - application/json
      parameters:
      - description: Monitor ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Monitor configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateMonitorRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.MonitorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a monitor
      tags:
      - monitors
  /monitors/{id}/stats:
    get:
      parameters:
      - description: Monitor UUID
        in: path
        name: id
        required: true
        type: string
      - description: History period
        enum:
        - 1h
        - 24h
        - 7d
        - 30d
        in: query
        name: period
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MonitorStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get monitor availability history for the current URL
      tags:
      - monitors
  /uploads:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: File up to 10 MB
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/service.UploadedFile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a file
      tags:
      - uploads
  /uploads/{category}/{filename}:
    get:
      parameters:
      - description: Storage category, such as avatars or files
        in: path
        name: category
        required: true
        type: string
      - description: UUID filename with its extension
        in: path
        name: filename
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
      summary: Download an uploaded file
      tags:
      - uploads
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - users
    patch:
      consumes:
      - application/json
      parameters:
      - description: Profile changes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update the current user
      tags:
      - users
  /users/me/avatar:
    put:
      consumes:
      - multipart/form-data
      parameters:
      - description: JPEG or PNG image up to 5 MB and 16 megapixels
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace the current user's avatar
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and an access token.
    in: header
    name: Authorization
    type: apiKey
  RefreshCookie:
    description: Cookie header containing the HttpOnly refresh_token issued by the
      authentication endpoints.
    in: header
    name: Cookie
    type: apiKey
swagger: "2.0"
